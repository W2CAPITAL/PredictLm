name: PredictLM CI

on:
  push:
    branches-ignore: [continuous-learning]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check scripts/continuous-learning/run.mjs
      - run: npm test
      - run: npm run build
