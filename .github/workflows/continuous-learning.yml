name: PredictLM Continuous Learning

on:
  push:
    branches: [main]
    paths:
      - 'scripts/continuous-learning/**'
      - 'config/continuous-learning.json'
      - 'config/github-knowledge-sources.json'
      - '.github/workflows/continuous-learning.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predictlm-continuous-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Research, verify, learn and publish
        run: node scripts/continuous-learning/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREDICTLM_PUBLISH_BRANCH: continuous-learning
          PREDICTLM_LEARNING_SPREADSHEET_ID: ${{ secrets.PREDICTLM_LEARNING_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
