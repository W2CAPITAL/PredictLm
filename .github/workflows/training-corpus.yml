name: PredictLM Training Corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync approved learning sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAIN_MAX_FILES_PER_REPO: "60"
          TRAIN_MAX_CHUNKS: "3500"
        run: npm run train:sync
      - name: Validate corpus
        run: npm run train:validate
      - uses: actions/upload-artifact@v4
        with:
          name: predictlm-training-corpus
          path: |
            training/corpus.jsonl
            reports/training/source-index.json
          retention-days: 14
