name: Global Learning Sync

on:
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: global-learning-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.label.name == 'learning-approved' || contains(github.event.issue.labels.*.name, 'learning-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: git restore package-lock.json 2>/dev/null || true
      - run: npm run learning:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Propose generated update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/global-lessons.json; then
            echo "No generated changes"
            exit 0
          fi
          BRANCH="automation/global-learning-sync"
          git config user.name "predictlm-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/global-lessons.json
          git commit -m "chore(learning): refresh approved global lessons"
          git push --force origin HEAD:"$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore(learning): refresh approved global lessons" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          else
            gh pr edit "$PR_NUMBER" --title "chore(learning): refresh approved global lessons" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          fi
