name: Global Learning Sync

on:
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: global-learning-sync
  cancel-in-progress: true

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.label.name == 'learning-approved' || contains(github.event.issue.labels.*.name, 'learning-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: git restore package-lock.json 2>/dev/null || true
      - run: npm run learning:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Commit approved global lessons
        run: |
          if git diff --quiet -- src/data/global-lessons.json; then
            echo "No global lesson changes"
            exit 0
          fi
          git config user.name "predictlm-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/global-lessons.json
          git commit -m "chore(learning): refresh approved global lessons"
          git restore package-lock.json package.json 2>/dev/null || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
