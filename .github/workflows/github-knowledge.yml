name: GitHub Knowledge Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/github-knowledge-sources.json"
      - "scripts/knowledge/sync-github.mjs"
      - ".github/workflows/github-knowledge.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: github-knowledge-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Restore install-only lock changes
        run: git restore package-lock.json 2>/dev/null || true
      - run: npm run knowledge:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Propose generated update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/github-knowledge-index.json reports/github-knowledge/manifest.json; then
            echo "No generated changes"
            exit 0
          fi
          BRANCH="automation/github-knowledge-sync"
          git config user.name "predictlm-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/github-knowledge-index.json reports/github-knowledge/manifest.json
          git commit -m "chore(knowledge): refresh GitHub index"
          git push --force origin HEAD:"$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore(knowledge): refresh GitHub index" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          else
            gh pr edit "$PR_NUMBER" --title "chore(knowledge): refresh GitHub index" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          fi
