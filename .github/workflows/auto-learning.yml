name: Autonomous Learning Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: autonomous-learning-snapshot
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run selfimprove:snapshot
      - run: npm test
      - run: npm run build
      - name: Propose generated update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- reports/selfimprove/auto-learning.json; then
            echo "No generated changes"
            exit 0
          fi
          BRANCH="automation/auto-learning-snapshot"
          git config user.name "predictlm-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add reports/selfimprove/auto-learning.json
          git commit -m "chore(learning): refresh autonomous-learning snapshot"
          git push --force origin HEAD:"$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore(learning): refresh autonomous-learning snapshot" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          else
            gh pr edit "$PR_NUMBER" --title "chore(learning): refresh autonomous-learning snapshot" --body "Automated generated-data refresh. Review and merge explicitly after CI."
          fi
